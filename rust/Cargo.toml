# Only the OnAir crates the DVB-S/S2 receiver needs, linked as one static library
[workspace]
resolver = "2"
members = ["onair_common", "onair_fec", "onair_ts", "onair_dvbsi", "datvrx_rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
